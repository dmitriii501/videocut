[package]
name = "streamreels"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Cut stream VODs / live Twitch into vertical reels with subtitles"
license = "MIT"

[[bin]]
name = "streamreels"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
csv = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart", "rustls-tls"], default-features = false }
url = "2"
base64 = "0.22"
ffmpeg-next = "9"
whisper-rs = "0.16"
nix = { version = "0.29", features = ["signal", "process"] }

[profile.release]
opt-level = 2
lto = "thin"
