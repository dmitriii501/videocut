<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 6580" fill="none">
  <defs>
    <style>
      text { font-family: "Noto Sans", sans-serif; }
    </style>
    <symbol id="mark" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="16" fill="#FF4D1C"/>
      <g stroke="#F7F4EF" stroke-width="4.25" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="22.25" cy="46.5" r="6.1"/>
        <circle cx="41.75" cy="46.5" r="6.1"/>
        <path d="M26.4 41.6 32 33.6 17.8 13.2"/>
        <path d="M37.6 41.6 32 33.6 46.2 13.2"/>
      </g>
      <circle cx="32" cy="33.6" r="2.35" fill="#F7F4EF"/>
    </symbol>
    <symbol id="mark-ink" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="16" fill="#17181C"/>
      <g stroke="#F7F4EF" stroke-width="4.25" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="22.25" cy="46.5" r="6.1"/>
        <circle cx="41.75" cy="46.5" r="6.1"/>
        <path d="M26.4 41.6 32 33.6 17.8 13.2"/>
        <path d="M37.6 41.6 32 33.6 46.2 13.2"/>
      </g>
      <circle cx="32" cy="33.6" r="2.35" fill="#F7F4EF"/>
    </symbol>
    <symbol id="mark-paper" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="16" fill="#F4F1EB"/>
      <g stroke="#17181C" stroke-width="4.25" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="22.25" cy="46.5" r="6.1"/>
        <circle cx="41.75" cy="46.5" r="6.1"/>
        <path d="M26.4 41.6 32 33.6 17.8 13.2"/>
        <path d="M37.6 41.6 32 33.6 46.2 13.2"/>
      </g>
      <circle cx="32" cy="33.6" r="2.35" fill="#17181C"/>
    </symbol>
  </defs>

  <!-- PAGE 1 COVER -->
  <g id="page-cover">
    <rect width="1440" height="900" fill="#F4F1EB"/>
    <rect x="72" y="64" width="14" height="14" rx="4" fill="#FF4D1C"/>
    <text x="98" y="76" fill="#6E6A64" font-size="14" font-weight="600" letter-spacing="1.6">БРЕНДБУК</text>
    <text x="1328" y="76" fill="#6E6A64" font-size="14" font-weight="600" text-anchor="end">01</text>

    <text x="72" y="390" fill="#17181C" font-size="168" font-weight="700" letter-spacing="-6">ЧИК</text>
    <text x="78" y="448" fill="#FF4D1C" font-size="28" font-weight="700" letter-spacing="3">CHIK</text>
    <text x="72" y="530" fill="#3A3834" font-size="32" font-weight="500">Из стрима — в вертикальный клип.</text>
    <text x="72" y="572" fill="#6E6A64" font-size="18">Сервис нарезает Twitch и YouTube в ролики 9:16.</text>

    <rect x="900" y="180" width="468" height="520" rx="36" fill="#17181C"/>
    <use href="#mark" x="1024" y="300" width="220" height="220"/>
    <text x="1134" y="600" fill="#F7F4EF" font-size="28" font-weight="700" text-anchor="middle">ЧИК</text>
    <text x="1134" y="632" fill="#A39E96" font-size="14" text-anchor="middle">знак сервиса</text>

    <line x1="72" y1="760" x2="1368" y2="760" stroke="#E3DDD4"/>
    <text x="72" y="808" fill="#6E6A64" font-size="14">Имя</text>
    <text x="72" y="836" fill="#17181C" font-size="18" font-weight="600">ЧИК / CHIK</text>
    <text x="420" y="808" fill="#6E6A64" font-size="14">Продукт</text>
    <text x="420" y="836" fill="#17181C" font-size="18" font-weight="600">Нарезки для стримеров</text>
    <text x="860" y="808" fill="#6E6A64" font-size="14">Формат</text>
    <text x="860" y="836" fill="#17181C" font-size="18" font-weight="600">Shorts, Reels, TikTok</text>
  </g>

  <!-- PAGE 2 ESSENCE -->
  <g id="page-essence" transform="translate(0 940)">
    <rect width="1440" height="900" fill="#F4F1EB"/>
    <text x="72" y="76" fill="#6E6A64" font-size="14" font-weight="600" letter-spacing="1.6">СУТЬ</text>
    <text x="1328" y="76" fill="#6E6A64" font-size="14" font-weight="600" text-anchor="end">02</text>
    <text x="72" y="180" fill="#17181C" font-size="56" font-weight="700">Что это за сервис</text>
    <text x="72" y="250" fill="#3A3834" font-size="26">Вставил ссылку на стрим — забрал готовые вертикальные ролики.</text>

    <rect x="72" y="320" width="1296" height="160" rx="24" fill="#17181C"/>
    <text x="108" y="390" fill="#F7F4EF" font-size="28" font-weight="600">ЧИК находит яркие моменты и собирает клип 9:16</text>
    <text x="108" y="434" fill="#C8C2B8" font-size="18">с субтитрами, кадром стримера и геймплеем в нижней половине.</text>

    <rect x="72" y="520" width="400" height="280" rx="24" fill="#FFFFFF"/>
    <text x="104" y="572" fill="#FF4D1C" font-size="14" font-weight="700">ДЛЯ КОГО</text>
    <text x="104" y="630" fill="#17181C" font-size="24" font-weight="700">Стримеры</text>
    <text x="104" y="678" fill="#6E6A64" font-size="16">Twitch и YouTube, кому нужны</text>
    <text x="104" y="704" fill="#6E6A64" font-size="16">клипы без таймлайна и монтажёра.</text>

    <rect x="500" y="520" width="400" height="280" rx="24" fill="#FFFFFF"/>
    <text x="532" y="572" fill="#FF4D1C" font-size="14" font-weight="700">ЧТО ДЕЛАЕМ</text>
    <text x="532" y="630" fill="#17181C" font-size="24" font-weight="700">Один проход</text>
    <text x="532" y="678" fill="#6E6A64" font-size="16">Ссылка, выбор пресета, пачка</text>
    <text x="532" y="704" fill="#6E6A64" font-size="16">роликов с заголовком и тегами.</text>

    <rect x="928" y="520" width="440" height="280" rx="24" fill="#FFFFFF"/>
    <text x="960" y="572" fill="#FF4D1C" font-size="14" font-weight="700">ЧЕМ НЕ ЯВЛЯЕМСЯ</text>
    <text x="960" y="630" fill="#17181C" font-size="24" font-weight="700">Не редактор</text>
    <text x="960" y="678" fill="#6E6A64" font-size="16">Нет дорожек, ключевых кадров</text>
    <text x="960" y="704" fill="#6E6A64" font-size="16">и панели на сто инструментов.</text>
  </g>

  <!-- PAGE 3 MARK -->
  <g id="page-mark" transform="translate(0 1880)">
    <rect width="1440" height="900" fill="#F4F1EB"/>
    <text x="72" y="76" fill="#6E6A64" font-size="14" font-weight="600" letter-spacing="1.6">ЗНАК</text>
    <text x="1328" y="76" fill="#6E6A64" font-size="14" font-weight="600" text-anchor="end">03</text>
    <text x="72" y="160" fill="#17181C" font-size="48" font-weight="700">Логотип</text>
    <text x="72" y="204" fill="#6E6A64" font-size="18">Ножницы — единственный символ. Рядом слово ЧИК, латиницей CHIK.</text>

    <use href="#mark" x="72" y="260" width="200" height="200"/>
    <text x="72" y="496" fill="#17181C" font-size="16" font-weight="600">Основной знак</text>
    <text x="72" y="522" fill="#6E6A64" font-size="14">Оранжевая плашка, светлые ножницы</text>

    <rect x="340" y="260" width="520" height="200" rx="24" fill="#FFFFFF"/>
    <use href="#mark" x="364" y="300" width="72" height="72"/>
    <text x="456" y="348" fill="#17181C" font-size="40" font-weight="700">ЧИК</text>
    <text x="364" y="420" fill="#6E6A64" font-size="14">Горизонтальный знак. Отступ от плашки — половина её стороны.</text>

    <rect x="900" y="260" width="468" height="200" rx="24" fill="#17181C"/>
    <use href="#mark" x="924" y="300" width="72" height="72"/>
    <text x="1016" y="348" fill="#F7F4EF" font-size="40" font-weight="700">ЧИК</text>
    <text x="924" y="420" fill="#A39E96" font-size="14">На тёмном фоне плашка не меняется.</text>

    <text x="72" y="600" fill="#17181C" font-size="20" font-weight="700">Так нельзя</text>

    <rect x="72" y="628" width="300" height="180" rx="20" fill="#FFFFFF"/>
    <use href="#mark" x="168" y="652" width="64" height="40"/>
    <text x="222" y="776" fill="#6E6A64" font-size="14" text-anchor="middle">Не растягивать</text>

    <rect x="396" y="628" width="300" height="180" rx="20" fill="#FFFFFF"/>
    <circle cx="546" cy="700" r="28" fill="#FFD54A"/>
    <text x="546" y="710" fill="#17181C" font-size="28" font-weight="700" text-anchor="middle">✂</text>
    <text x="546" y="776" fill="#6E6A64" font-size="14" text-anchor="middle">Не заменять эмодзи</text>

    <rect x="720" y="628" width="300" height="180" rx="20" fill="#FFFFFF"/>
    <use href="#mark-ink" x="838" y="656" width="64" height="64" transform="rotate(-18 870 688)"/>
    <text x="870" y="776" fill="#6E6A64" font-size="14" text-anchor="middle">Не поворачивать</text>

    <rect x="1044" y="628" width="324" height="180" rx="20" fill="#FFFFFF"/>
    <g transform="translate(1174 656)" fill="none" stroke="#17181C" stroke-width="2" stroke-linecap="round">
      <rect x="1" y="1" width="62" height="62" rx="16"/>
      <circle cx="22" cy="46" r="6"/>
      <circle cx="42" cy="46" r="6"/>
      <path d="M26 41 32 33 18 13"/>
      <path d="M38 41 32 33 46 13"/>
    </g>
    <text x="1206" y="776" fill="#6E6A64" font-size="14" text-anchor="middle">Не оставлять контуром</text>
  </g>

  <!-- PAGE 4 COLOR -->
  <g id="page-color" transform="translate(0 2820)">
    <rect width="1440" height="900" fill="#F4F1EB"/>
    <text x="72" y="76" fill="#6E6A64" font-size="14" font-weight="600" letter-spacing="1.6">ЦВЕТ</text>
    <text x="1328" y="76" fill="#6E6A64" font-size="14" font-weight="600" text-anchor="end">04</text>
    <text x="72" y="160" fill="#17181C" font-size="48" font-weight="700">Палитра</text>
    <text x="72" y="208" fill="#6E6A64" font-size="18">Один акцент. Остальное — тёплый тёмный интерфейс и бумажный текст.</text>

    <g>
      <rect x="72" y="270" width="200" height="250" rx="22" fill="#FF4D1C"/>
      <text x="96" y="470" fill="#FFFFFF" font-size="16" font-weight="700">Акцент</text>
      <text x="96" y="494" fill="#FFFFFF" font-size="14">#FF4D1C</text>
    </g>
    <g>
      <rect x="292" y="270" width="200" height="250" rx="22" fill="#17181C"/>
      <text x="316" y="470" fill="#F7F4EF" font-size="16" font-weight="700">Чернила</text>
      <text x="316" y="494" fill="#C8C2B8" font-size="14">#17181C</text>
    </g>
    <g>
      <rect x="512" y="270" width="200" height="250" rx="22" fill="#1C1F27"/>
      <text x="536" y="470" fill="#F7F4EF" font-size="16" font-weight="700">Поверхность</text>
      <text x="536" y="494" fill="#C8C2B8" font-size="14">#1C1F27</text>
    </g>
    <g>
      <rect x="732" y="270" width="200" height="250" rx="22" fill="#F7F4EF" stroke="#E3DDD4"/>
      <text x="756" y="470" fill="#17181C" font-size="16" font-weight="700">Бумага</text>
      <text x="756" y="494" fill="#6E6A64" font-size="14">#F7F4EF</text>
    </g>
    <g>
      <rect x="952" y="270" width="200" height="250" rx="22" fill="#6E6A64"/>
      <text x="976" y="470" fill="#FFFFFF" font-size="16" font-weight="700">Вторичный</text>
      <text x="976" y="494" fill="#F4F1EB" font-size="14">#6E6A64</text>
    </g>
    <g>
      <rect x="1172" y="270" width="196" height="250" rx="22" fill="#E5484D"/>
      <text x="1196" y="470" fill="#FFFFFF" font-size="16" font-weight="700">Ошибка</text>
      <text x="1196" y="494" fill="#FFFFFF" font-size="14">#E5484D</text>
    </g>

    <text x="72" y="600" fill="#17181C" font-size="20" font-weight="700">Как применять</text>
    <text x="72" y="648" fill="#3A3834" font-size="18">Акцент — кнопка действия, знак и активный пункт. Не заливать им большие поля.</text>
    <text x="72" y="684" fill="#3A3834" font-size="18">Ошибку не использовать как украшение. Чернила и поверхность — фон продукта.</text>
    <text x="72" y="720" fill="#3A3834" font-size="18">Бумага — текст на тёмном и фон этого брендбука. Вторичный — подписи.</text>

    <rect x="72" y="770" width="18" height="18" rx="5" fill="#FF4D1C"/>
    <text x="102" y="785" fill="#6E6A64" font-size="14">Наведение акцента: #FF6A3D. Граница карточек в продукте: #343846.</text>
  </g>

  <!-- PAGE 5 TYPE -->
  <g id="page-type" transform="translate(0 3760)">
    <rect width="1440" height="900" fill="#F4F1EB"/>
    <text x="72" y="76" fill="#6E6A64" font-size="14" font-weight="600" letter-spacing="1.6">ШРИФТ</text>
    <text x="1328" y="76" fill="#6E6A64" font-size="14" font-weight="600" text-anchor="end">05</text>
    <text x="72" y="160" fill="#17181C" font-size="48" font-weight="700">Одна гарнитура</text>
    <text x="72" y="208" fill="#6E6A64" font-size="18">Noto Sans. Кириллица и латиница, без моноширинного «пульта» и без второго акцидентного шрифта.</text>

    <text x="72" y="340" fill="#17181C" font-size="84" font-weight="700">ЧИК нарезает стрим</text>
    <text x="72" y="400" fill="#6E6A64" font-size="16">Заголовок · Noto Sans Bold · 84</text>

    <text x="72" y="500" fill="#17181C" font-size="36" font-weight="700">Готовый ролик за пару минут</text>
    <text x="72" y="540" fill="#6E6A64" font-size="16">Подзаголовок · Noto Sans Bold · 36</text>

    <text x="72" y="630" fill="#3A3834" font-size="20">Вставь ссылку на VOD или прямой эфир. Сервис найдёт моменты, соберёт 9:16 и подпишет речь.</text>
    <text x="72" y="668" fill="#6E6A64" font-size="16">Текст · Noto Sans Regular · 20</text>

    <text x="72" y="760" fill="#6E6A64" font-size="14" font-weight="600">ПОДПИСЬ · NOTO SANS SEMIBOLD · 14 · МЕЖБУКВЕННЫЙ ИНТЕРВАЛ НЕБОЛЬШОЙ</text>
    <text x="72" y="820" fill="#17181C" font-size="18">Цифры и таймкоды тем же шрифтом: 12:30–13:05, 1080×1920, 1 клип = 1 кредит.</text>
  </g>

  <!-- PAGE 6 VOICE -->
  <g id="page-voice" transform="translate(0 4700)">
    <rect width="1440" height="900" fill="#F4F1EB"/>
    <text x="72" y="76" fill="#6E6A64" font-size="14" font-weight="600" letter-spacing="1.6">ГОЛОС</text>
    <text x="1328" y="76" fill="#6E6A64" font-size="14" font-weight="600" text-anchor="end">06</text>
    <text x="72" y="160" fill="#17181C" font-size="48" font-weight="700">Как говорим</text>
    <text x="72" y="208" fill="#6E6A64" font-size="18">Коротко, на «ты», по делу. Без канцелярита и без сленга ради сленга.</text>

    <rect x="72" y="270" width="628" height="150" rx="22" fill="#FFFFFF"/>
    <text x="104" y="322" fill="#1F8A4C" font-size="14" font-weight="700">ТАК</text>
    <text x="104" y="366" fill="#17181C" font-size="22" font-weight="600">Ссылка не открылась. Проверь стрим.</text>

    <rect x="740" y="270" width="628" height="150" rx="22" fill="#FFFFFF"/>
    <text x="772" y="322" fill="#E5484D" font-size="14" font-weight="700">НЕ ТАК</text>
    <text x="772" y="366" fill="#17181C" font-size="20">Произошла непредвиденная ошибка шлюза.</text>

    <rect x="72" y="446" width="628" height="150" rx="22" fill="#FFFFFF"/>
    <text x="104" y="498" fill="#1F8A4C" font-size="14" font-weight="700">ТАК</text>
    <text x="104" y="542" fill="#17181C" font-size="22" font-weight="600">Ищем громкие моменты и всплески чата.</text>

    <rect x="740" y="446" width="628" height="150" rx="22" fill="#FFFFFF"/>
    <text x="772" y="498" fill="#E5484D" font-size="14" font-weight="700">НЕ ТАК</text>
    <text x="772" y="542" fill="#17181C" font-size="20">Нюхаем звук и чат, ловим сочные моменты.</text>

    <rect x="72" y="622" width="1296" height="190" rx="22" fill="#17181C"/>
    <text x="108" y="682" fill="#FF4D1C" font-size="14" font-weight="700">ПРАВИЛО</text>
    <text x="108" y="734" fill="#F7F4EF" font-size="26" font-weight="600">Одно действие в фразе. Название продукта — ЧИК, без кавычек и без «системы».</text>
    <text x="108" y="776" fill="#C8C2B8" font-size="16">Кнопка называется глаголом: «Нарезать», «Открыть студию», «Скачать».</text>
  </g>

  <!-- PAGE 7 UI -->
  <g id="page-ui" transform="translate(0 5640)">
    <rect width="1440" height="900" fill="#F4F1EB"/>
    <text x="72" y="76" fill="#6E6A64" font-size="14" font-weight="600" letter-spacing="1.6">ИНТЕРФЕЙС</text>
    <text x="1328" y="76" fill="#6E6A64" font-size="14" font-weight="600" text-anchor="end">07</text>
    <text x="72" y="150" fill="#17181C" font-size="48" font-weight="700">Как выглядит продукт</text>

    <rect x="72" y="200" width="1296" height="620" rx="28" fill="#14161C"/>

    <use href="#mark" x="108" y="232" width="44" height="44"/>
    <text x="166" y="262" fill="#F7F4EF" font-size="22" font-weight="700">ЧИК</text>

    <rect x="430" y="236" width="560" height="40" rx="12" fill="#1C1F27"/>
    <rect x="438" y="242" width="120" height="28" rx="8" fill="#FF4D1C"/>
    <text x="498" y="262" fill="#FFFFFF" font-size="14" font-weight="600" text-anchor="middle">О сервисе</text>
    <text x="620" y="262" fill="#A39E96" font-size="14" text-anchor="middle">Студия</text>
    <text x="740" y="262" fill="#A39E96" font-size="14" text-anchor="middle">Клипы</text>
    <text x="860" y="262" fill="#A39E96" font-size="14" text-anchor="middle">Тарифы</text>

    <rect x="1120" y="236" width="210" height="40" rx="12" fill="#FF4D1C"/>
    <text x="1225" y="262" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">В студию</text>

    <text x="108" y="360" fill="#F7F4EF" font-size="40" font-weight="700">Из стрима — в клип</text>
    <text x="108" y="404" fill="#A39E96" font-size="16">Ссылка на Twitch или YouTube. Дальше сервис работает сам.</text>

    <rect x="108" y="450" width="620" height="56" rx="14" fill="#101114" stroke="#343846"/>
    <text x="132" y="484" fill="#6E6A64" font-size="16">https://twitch.tv/channel</text>

    <rect x="108" y="528" width="220" height="52" rx="14" fill="#FF4D1C"/>
    <text x="218" y="560" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle">Нарезать</text>

    <rect x="860" y="360" width="220" height="390" rx="24" fill="#101114" stroke="#343846"/>
    <rect x="876" y="376" width="188" height="168" rx="12" fill="#1C1F27"/>
    <text x="970" y="468" fill="#A39E96" font-size="12" text-anchor="middle">стрим</text>
    <rect x="876" y="556" width="188" height="120" rx="12" fill="#2A241F"/>
    <text x="970" y="624" fill="#FF4D1C" font-size="12" text-anchor="middle">геймплей</text>
    <text x="970" y="720" fill="#F7F4EF" font-size="13" font-weight="600" text-anchor="middle">субтитр в такт</text>

    <text x="108" y="700" fill="#6E6A64" font-size="14">Скругление 14–16. Тень мягкая.</text>
    <text x="108" y="724" fill="#6E6A64" font-size="14">Один акцентный цвет на действие.</text>
    <text x="72" y="868" fill="#6E6A64" font-size="13">ЧИК  ·  брендбук сервиса  ·  вектор</text>
  </g>
</svg>
